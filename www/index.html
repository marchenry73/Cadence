<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cadence — Plan your work, see your week</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#10151E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ground:#101319; --surface:#171B23; --surface2:#1D222C; --raised:#232935;
  --line:#262C38; --line-soft:#1F242E;
  --ink:#F0F2F6; --muted:#98A0B0; --dim:#6B7383;
  --signal:#7C6AF0; --signal-ink:#FFFFFF; --signal-soft:rgba(124,106,240,.14);
  --good:#3ECFB2; --warn:#FF8462; --info:#6FA8FF;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 8px 24px rgba(0,0,0,.22);
  --shadow-sm:0 1px 2px rgba(0,0,0,.24);
  --r:10px; --r-lg:16px; --r-sm:7px;
  --shell:1500px;
}
:root[data-theme="light"]{
  --ground:#F7F6F3; --surface:#FFFFFF; --surface2:#F4F3EF; --raised:#EDECE7;
  --line:#E6E4DE; --line-soft:#F0EFEA;
  --ink:#1A1A1E; --muted:#63615B; --dim:#8D8B83;
  --signal:#5B4BD6; --signal-ink:#FFFFFF; --signal-soft:rgba(91,75,214,.08);
  --good:#0E9E86; --warn:#DD5F33; --info:#2E68D8;
  --shadow:0 1px 2px rgba(30,28,24,.05), 0 6px 20px rgba(30,28,24,.06);
  --shadow-sm:0 1px 2px rgba(30,28,24,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.022em;line-height:1.2}
h1{font-size:28px} h2{font-size:18px} h3{font-size:15px}
a{color:var(--signal)}
.hidden{display:none !important}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500}
.muted{color:var(--muted)} .dim{color:var(--dim)} .tiny{font-size:12.5px}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 0}
.mark{display:flex;align-items:center;gap:11px;padding:0 22px 24px}
.mark-glyph{width:32px;height:32px;border-radius:9px;background:var(--signal);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;box-shadow:var(--shadow-sm)}
.mark-name{font-weight:800;letter-spacing:-.02em;font-size:16px}
.nav{padding:0 12px;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;
  color:var(--muted);padding:10px 13px;margin:2px 0;font:inherit;font-size:13.5px;
  text-align:left;cursor:pointer;border-radius:var(--r);transition:background .13s,color .13s}
.nav button:hover{color:var(--ink);background:var(--surface2)}
.nav button.on{color:var(--ink);background:var(--signal-soft);font-weight:600}
.rail-foot{padding:16px 22px 0;border-top:1px solid var(--line);margin-top:14px}

main{min-width:0;padding:30px 34px 70px;max-width:var(--shell)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.topbar-clock{text-align:right}
.clock{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:500}
.clockdate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.05em}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 22px;box-shadow:var(--shadow-sm)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
.s9{grid-column:span 9}.s12{grid-column:span 12}
.stack{display:grid;gap:9px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}

.stat-n{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;letter-spacing:-.025em;line-height:1}
.stat-l{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-top:8px}

.spine{position:relative;padding-left:58px}
.spine-rail{position:absolute;left:48px;top:0;bottom:0;width:1px;background:var(--line)}
.spine-hour{position:absolute;left:0;display:flex;align-items:center;width:100%;transform:translateY(-50%)}
.spine-hour .t{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);width:44px;text-align:right}
.spine-hour .tick{height:1px;background:var(--line-soft);flex:1;margin-left:5px}
.spine-hour.major .t{color:var(--muted)}
.spine-hour.major .tick{background:var(--line)}
.spine-block{position:absolute;left:58px;right:4px;border-radius:var(--r-sm);padding:6px 10px;overflow:hidden;
  background:color-mix(in srgb,var(--cat,var(--signal)) 15%,var(--surface));
  border:1px solid color-mix(in srgb,var(--cat,var(--signal)) 34%,transparent);
  cursor:grab;transition:box-shadow .13s,transform .13s}
.spine-block:hover{box-shadow:var(--shadow);z-index:4}
.spine-block.dragging{opacity:.5;cursor:grabbing}
.spine-block .bt{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine-block .bs{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
.spine-block .bx{position:absolute;top:3px;right:5px;opacity:0;background:var(--raised);border:0;
  color:var(--muted);border-radius:5px;width:19px;height:19px;font-size:13px;line-height:1;padding:0}
.spine-block:hover .bx{opacity:1}
.spine-block .bx:hover{color:var(--warn)}
.spine-now{position:absolute;left:36px;right:0;height:0;z-index:6;pointer-events:none}
.spine-now::before{content:'';position:absolute;left:14px;right:0;top:0;height:1.5px;background:var(--warn)}
.spine-now::after{content:'';position:absolute;left:9px;top:-3.5px;width:8px;height:8px;border-radius:50%;
  background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.spine-drop{position:absolute;left:58px;right:4px;border-radius:var(--r-sm);
  border:1.5px dashed var(--signal);background:var(--signal-soft);pointer-events:none;z-index:5;display:none}

.weekwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);max-height:72vh;
  background:var(--surface);box-shadow:var(--shadow-sm)}
.weekgrid{display:grid;grid-template-columns:60px repeat(7,minmax(142px,1fr));min-width:1120px}
.wcell{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);min-height:28px;padding:2px}
.whead{position:sticky;top:0;z-index:3;background:var(--surface2);border-bottom:1px solid var(--line);padding:11px 6px;text-align:center}
.whead .wd{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.whead .wn{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;margin-top:3px}
.whead.today .wn,.whead.today .wd{color:var(--signal)}
.wtime{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);text-align:right;
  padding-right:8px;background:var(--surface);border-right:1px solid var(--line)}
.wblock{border-radius:5px;padding:3px 7px;font-size:11.5px;font-weight:500;margin-bottom:2px;
  background:color-mix(in srgb,var(--cat,var(--signal)) 16%,var(--surface));
  border:1px solid color-mix(in srgb,var(--cat,var(--signal)) 30%,transparent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wcol-today{background:var(--signal-soft)}

.item{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--surface2);
  cursor:pointer;transition:border-color .13s,box-shadow .13s}
.item:hover{border-color:var(--dim);box-shadow:var(--shadow-sm)}
.item.done{opacity:.42}
.item.done .item-t{text-decoration:line-through}
.item-t{font-weight:600;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--raised);
  border-radius:999px;padding:3px 9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cat,var(--signal));flex:none}
.meter{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;background:var(--signal);border-radius:999px;transition:width .3s}

label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--ground);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-size:13.5px;transition:border-color .13s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto}
button{font:inherit;cursor:pointer}
.btn{background:var(--signal);color:var(--signal-ink);border:0;border-radius:var(--r-sm);
  padding:10px 17px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-sm);transition:filter .13s}
.btn:hover{filter:brightness(1.1)}
.btn-2{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 15px;font-size:13.5px}
.btn-2:hover{border-color:var(--dim)}
.btn-x{background:transparent;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);
  border-radius:var(--r-sm);padding:9px 15px;font-size:13.5px}
.btn-s{padding:6px 12px;font-size:12.5px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{background:transparent;border:0;color:var(--muted);padding:6px 13px;font-size:12.5px;border-radius:5px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.daypick{display:flex;gap:5px;flex-wrap:wrap}
.daypick button{width:38px;height:36px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  border-radius:var(--r-sm);font-family:'IBM Plex Mono',monospace;font-size:11px}
.daypick button.on{background:var(--signal);color:#fff;border-color:var(--signal);font-weight:600}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.quad button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:var(--r);
  padding:13px 11px;text-align:left;font-size:12px;line-height:1.35}
.quad button.on{border-color:var(--signal);background:var(--signal-soft);color:var(--ink)}
.quad button b{display:block;font-weight:600;font-size:12.5px;margin-bottom:3px;color:var(--ink)}

.timer-run{color:var(--signal)}
.member{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--signal-soft);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--signal);flex:none}
.status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.status.busy{color:var(--warn)} .status.free{color:var(--good)}
.code{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--signal);background:var(--signal-soft);
  border-radius:var(--r);padding:14px;text-align:center;word-break:break-all}

.scrim{position:fixed;inset:0;background:rgba(8,10,14,.62);backdrop-filter:blur(3px);display:none;
  place-items:center;z-index:60;padding:20px}
.scrim.on{display:grid}
.sheet{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-body{padding:22px}
.cmdrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer}
.cmdrow.sel{background:var(--signal-soft)}
.cmdrow .k{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}

.gate{position:fixed;inset:0;z-index:80;background:var(--ground);display:grid;place-items:center;padding:24px;overflow:auto}
.gate-card{width:min(410px,100%)}
.gate-mark{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.gate-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);letter-spacing:.11em;margin-top:3px}
.msg{font-size:12.5px;margin-top:12px;min-height:17px}
.msg.err{color:var(--warn)} .msg.ok{color:var(--good)}
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{height:3px;flex:1;background:var(--line);border-radius:999px}
.steps i.on{background:var(--signal)}

.streak{display:flex;gap:4px;margin-top:10px}
.streak i{width:100%;height:22px;border-radius:4px;background:var(--line)}
.streak i.hit{background:var(--signal)}
.warnbar{border-radius:var(--r);background:color-mix(in srgb,var(--warn) 11%,var(--surface));
  border:1px solid color-mix(in srgb,var(--warn) 26%,transparent);padding:13px 16px;margin-bottom:18px;font-size:13px}
.empty{text-align:center;padding:44px 24px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--muted);background:var(--surface)}
.empty h3{margin-bottom:7px;color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--raised);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 20px;font-size:13px;z-index:90;
  transition:transform .24s;box-shadow:var(--shadow)}
.toast.on{transform:translateX(-50%) translateY(0)}

.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.mhead{background:var(--surface2);padding:9px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.mcell{background:var(--surface);min-height:104px;padding:7px;cursor:pointer;transition:background .12s}
.mcell:hover{background:var(--surface2)}
.mcell.other{opacity:.4}
.mcell.mtoday{background:var(--signal-soft)}
.mnum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:5px}
.mcell.mtoday .mnum{color:var(--signal);font-weight:600}
.mblock{border-radius:4px;padding:2px 6px;font-size:11px;font-weight:500;margin-bottom:2px;
  background:color-mix(in srgb,var(--cat,var(--signal)) 17%,var(--surface));
  border-left:2px solid var(--cat,var(--signal));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agday{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.agdate{width:56px;flex:none;text-align:center}
.agrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;flex-wrap:wrap}
.agrow:hover{background:var(--surface2)}
@media(max-width:900px){.mcell{min-height:76px}.agday{gap:12px}.agrow span:first-child{width:auto}}
.goal{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;background:var(--surface);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .13s}
.goal:hover{box-shadow:var(--shadow)}
.goal-ring{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.area-tab{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:7px 14px;font-size:12.5px}
.area-tab.on{background:var(--signal);color:#fff;border-color:var(--signal);font-weight:600}
.milestone{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.ms-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:12px;color:transparent;background:transparent}
.ms-check.on{background:var(--signal);border-color:var(--signal);color:#fff}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:50;flex-direction:row;padding:0;
    border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .mark,.rail-foot{display:none}
  .nav{display:flex;padding:0;flex:1}
  .nav button{flex-direction:column;gap:3px;font-size:10px;padding:10px 13px;border-radius:0;white-space:nowrap}
  .nav button.on{background:transparent;color:var(--signal)}
  main{padding:20px 16px 96px}
  .s3,.s4,.s5,.s6,.s7,.s8,.s9{grid-column:span 12}
  h1{font-size:22px}
  .topbar-clock{text-align:left}
  .weekgrid{grid-template-columns:48px repeat(7,minmax(116px,1fr));min-width:900px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="gate" id="gate"></div>

<div class="app hidden" id="shell">
  <aside class="rail">
    <div class="mark">
      <div class="mark-glyph">C</div>
      <div class="mark-name">Cadence</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="eyebrow" id="railOrg"></div>
      <div class="tiny muted" id="railUser" style="margin-top:4px"></div>
      <div class="row" style="margin-top:10px;gap:6px">
        <button class="btn-2 btn-s" onclick="toggleTheme()" id="themeBtn" style="flex:1">Light</button>
        <button class="btn-2 btn-s" onclick="openCmd()" title="Ctrl+K">⌘K</button>
      </div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <div class="eyebrow" id="pageKicker"></div>
        <h1 id="pageTitle" style="margin-top:5px"></h1>
        <p class="muted tiny" id="pageSub" style="margin:4px 0 0"></p>
      </div>
      <div class="topbar-clock">
        <div class="clock" id="clock">--:--</div>
        <div class="clockdate" id="clockdate"></div>
      </div>
    </div>
    <section id="view"></section>
  </main>
</div>

<div class="scrim" id="scrim">
  <div class="sheet">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="btn-2 btn-s" onclick="closeSheet()">Close</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="scrim" id="cmdScrim" style="align-items:flex-start;padding-top:12vh">
  <div class="sheet" style="width:min(560px,100%)">
    <div style="padding:14px 18px;border-bottom:1px solid var(--line)">
      <input id="cmdInput" placeholder="Search or type a command…" autocomplete="off" style="border:0;background:transparent;padding:0;font-size:16px">
    </div>
    <div id="cmdResults" style="max-height:52vh;overflow:auto;padding:8px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
