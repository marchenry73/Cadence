<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KingdomOS v16.1</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#080c1a" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#070a14;--panel:#0d1324;--panel2:#121b31;--text:#f8fafc;--muted:#9aa4b2;--line:rgba(255,255,255,.12);--gold:#f4c869;--green:#39e6a8;--blue:#60a5fa;--purple:#c084fc;--red:#fb7185;--orange:#fb923c;--free:rgba(57,230,168,.11);--work:rgba(96,165,250,.20);--ministry:rgba(192,132,252,.22);--studies:rgba(244,200,105,.20);--health:rgba(57,230,168,.18);--family:rgba(251,146,60,.18);--finance:rgba(20,184,166,.20);--rest:rgba(148,163,184,.15);--slot:34px}
    *{box-sizing:border-box} body{margin:0;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 15% 0%,#1e2e5c,transparent 34%),radial-gradient(circle at 85% 8%,#18443b,transparent 30%),linear-gradient(160deg,#050714,#0b1020 55%,#06131a)}
    body.mode-vacation{--gold:#7dd3fc;--green:#60a5fa}body.mode-heavy-ministry{--gold:#d8b4fe;--green:#f0abfc}body.mode-financial-push{--gold:#34d399;--green:#2dd4bf}body.mode-recovery{--gold:#fbbf24;--green:#fde68a}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px;background:rgba(4,7,18,.78);border-right:1px solid var(--line);backdrop-filter:blur(18px)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo{width:46px;height:46px;border-radius:17px;background:linear-gradient(135deg,var(--gold),var(--green));display:grid;place-items:center;color:#06111f;font-weight:1000;box-shadow:0 10px 40px rgba(57,230,168,.16)}.brand h1{margin:0;font-size:21px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.nav button{width:100%;display:flex;gap:10px;align-items:center;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:15px;padding:12px;margin:6px 0;cursor:pointer;text-align:left}.nav button.active,.nav button:hover{background:rgba(255,255,255,.07);color:white;border-color:var(--line)}
    main{padding:24px;max-width:1900px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.kicker{color:var(--gold);font-weight:900;letter-spacing:.09em;text-transform:uppercase;font-size:12px}.title{font-size:35px;margin:4px 0}.subtitle{color:var(--muted);margin:0}.clock{font-weight:1000;font-size:24px;color:var(--green);text-align:right}.date{color:var(--muted);font-size:13px;text-align:right}.modebar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;padding:9px 12px;border-radius:999px;cursor:pointer}.chip.active{background:linear-gradient(135deg,rgba(244,200,105,.25),rgba(57,230,168,.18));border-color:rgba(244,200,105,.55)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(180deg,rgba(18,27,49,.92),rgba(8,13,26,.96));border:1px solid var(--line);border-radius:25px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.30)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.card h2{margin:0 0 12px;font-size:18px}.metric{font-size:34px;font-weight:1000}.muted{color:var(--muted)}.tiny{font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.stack{display:grid;gap:10px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);font-size:12px;margin:2px}.badge{padding:6px 10px;border-radius:999px;background:rgba(57,230,168,.12);border:1px solid rgba(57,230,168,.26);color:#c8ffe9;font-size:12px;font-weight:800}.item{padding:12px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.04);cursor:pointer}.item:hover{border-color:rgba(244,200,105,.55)}.item.done{opacity:.55}.name{font-weight:900}.progress{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#071020;border:1px solid var(--line);color:white;border-radius:12px;padding:10px}textarea{min-height:92px;resize:vertical}button.primary{background:linear-gradient(135deg,var(--gold),var(--green));border:0;color:#06111f;border-radius:12px;padding:10px 14px;font-weight:950;cursor:pointer}button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:white;border-radius:12px;padding:9px 12px;cursor:pointer}button.danger{background:rgba(251,113,133,.16);border:1px solid rgba(251,113,133,.32);color:#fecdd3;border-radius:12px;padding:9px 12px;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:rgba(255,255,255,.06);border:1px solid var(--line);color:white;border-radius:12px;padding:9px 12px;cursor:pointer}.tab.active{background:rgba(244,200,105,.15);border-color:rgba(244,200,105,.55)}
    .dashboard-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.widget{cursor:grab}.widget.dragging{opacity:.55;transform:scale(.99)}.hero{background:radial-gradient(circle at top left,rgba(244,200,105,.26),transparent 34%),linear-gradient(135deg,rgba(57,230,168,.13),rgba(96,165,250,.08));border-color:rgba(244,200,105,.35)}
    .timerDock{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.timerNum{font-size:42px;font-weight:1000;letter-spacing:.04em}.timerControls{display:flex;gap:8px;flex-wrap:wrap}.timerBtn{width:auto}.timerFull{font-size:70px;text-align:center;font-weight:1000;letter-spacing:.04em}.soundSelect{display:grid;grid-template-columns:1fr 130px;gap:10px}.soundBadge{border:1px solid rgba(244,200,105,.38);background:rgba(244,200,105,.09);border-radius:14px;padding:10px}
    .calendar-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.weekWrap{overflow:auto;border:1px solid var(--line);border-radius:20px;max-height:76vh;background:rgba(0,0,0,.12)}.weekGrid{display:grid;grid-template-columns:92px repeat(7,minmax(185px,1fr));min-width:1450px}.calCell{min-height:var(--slot);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;font-size:11px;position:relative}.calHead{background:rgba(255,255,255,.08);font-weight:1000;text-align:center;position:sticky;top:0;z-index:2}.timeCell{color:var(--muted);background:rgba(255,255,255,.025);font-weight:800}.block{border-radius:9px;padding:3px 6px;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850}.work{background:var(--work)}.ministry{background:var(--ministry)}.studies{background:var(--studies)}.health{background:var(--health)}.family{background:var(--family)}.finance{background:var(--finance)}.rest{background:var(--rest)}.free{background:var(--free);color:#c7f9df}.todayCol{outline:2px solid rgba(244,200,105,.78);outline-offset:-2px}.nowLine{height:3px;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;box-shadow:0 0 16px rgba(251,113,133,.6)}.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.mday{min-height:120px;border:1px solid var(--line);border-radius:16px;padding:8px;background:rgba(255,255,255,.035)}.yearGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini{border:1px solid var(--line);border-radius:16px;padding:10px;background:rgba(255,255,255,.035)}
    .bibleShell{display:grid;grid-template-columns:320px 1fr;gap:16px}.biblePane{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:24px;padding:16px}.verse{padding:13px 14px;border-radius:15px;margin:8px 0;line-height:1.65;background:rgba(255,255,255,.035);border:1px solid transparent}.verse:hover{border-color:rgba(244,200,105,.5)}.verse.highlight{background:rgba(244,200,105,.16);border-color:rgba(244,200,105,.42)}.verseNum{color:var(--gold);font-weight:1000;margin-right:8px}.noteBox{border-left:3px solid var(--green);padding-left:10px;color:#d8fff0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;place-items:center;z-index:30}.modal.open{display:grid}.dialog{width:min(920px,94vw);max-height:88vh;overflow:auto;background:#0b1220;border:1px solid var(--line);border-radius:24px;padding:20px}.hidden{display:none}.reportCard{border-left:4px solid var(--gold)}
    #authGate{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 15% 0%,#1e2e5c,transparent 34%),radial-gradient(circle at 85% 8%,#18443b,transparent 30%),linear-gradient(160deg,#050714,#0b1020 55%,#06131a);padding:20px}
    @media(max-width:950px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.top{display:block}.bibleShell{grid-template-columns:1fr}.monthGrid,.yearGrid{grid-template-columns:1fr}.dashboard-grid{grid-template-columns:1fr}.widget{grid-column:auto!important}.timerDock{grid-template-columns:1fr}.weekGrid{grid-template-columns:76px repeat(7,minmax(135px,1fr));min-width:1050px}}
  </style>
</head>
<body>
  <div id="authGate"></div>
  <div class="app hidden">
    <aside class="side"><div class="brand"><div class="logo">K</div><div><h1>KingdomOS</h1><p>v16.1 Life Operating System</p></div></div><div class="nav" id="nav"></div></aside>
    <main><div class="top"><div><div class="kicker">Command Center</div><h1 class="title" id="pageTitle">Dashboard</h1><p class="subtitle" id="pageSub">What deserves your next hour?</p></div><div><div class="clock" id="liveClock">--:--</div><div class="date" id="liveDate"></div><div class="modebar" id="modebar"></div></div></div><section id="content"></section></main>
  </div>
  <div class="modal" id="modal"><div class="dialog"><div class="row"><h2 id="modalTitle">Edit</h2><button class="ghost" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
  <script src="app.js"></script>
</body>
</html>
